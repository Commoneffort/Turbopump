<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hedge desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#121212; --panel:#1c1c1c; --raised:#2a2a2a; --line:#2a2a2a; --line2:#3a3a3a; --line3:#4a4a4a; --muted:#8a8a8a; --text:#f4f4f4; --coral:#e15a48; --green:#48e160; --mono:"JetBrains Mono",ui-monospace,monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono, td.n, .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  header { height: 48px; display: flex; align-items: center; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header b { font-size: 15px; font-weight: 600; }
  header .logo { color: var(--coral); display: flex; }
  header .tabs { display: flex; align-self: stretch; gap: 4px; }
  header .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-top: 2px solid transparent; color: var(--muted); padding: 0 12px; font: 500 13px Inter, sans-serif; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  header .tabs button.on { color: var(--text); border-bottom-color: var(--coral); }
  header .right { margin-left: auto; color: var(--muted); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line3); display: inline-block; }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--coral); }
  main { display: grid; gap: 1px; background: var(--line); grid-template-columns: minmax(0, 3fr) minmax(0, 1.25fr); }
  section { background: var(--panel); min-width: 0; }
  .full { grid-column: 1 / -1; }
  h3 { margin: 0; padding: 12px 16px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .banner { display: flex; align-items: center; gap: 18px; padding: 14px 16px; }
  .state { font: 600 13px var(--mono); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line3); letter-spacing: .04em; }
  .state.ok { color: var(--green); border-color: rgba(72,225,96,.5); background: rgba(72,225,96,.08); }
  .state.bad { color: var(--coral); border-color: rgba(225,90,72,.6); background: rgba(225,90,72,.1); }
  .banner .why { color: var(--text); flex: 1; }
  .banner .age { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .age.stale { color: var(--coral); }
  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  .tile { background: var(--panel); padding: 12px 16px 14px; }
  .tile .l { color: var(--muted); font-size: 11px; }
  .tile .v { font-size: 19px; font-weight: 500; margin-top: 2px; }
  .tile .s { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .up { color: var(--green); } .down { color: var(--coral); } .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; font-weight: 400; font-size: 11px; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { text-align: right; padding: 9px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12.5px; }
  th:first-child, td:first-child, th.t, td.t { text-align: left; }
  tr:hover td { background: #202020; }
  .chip { font: 500 10.5px var(--mono); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line3); color: var(--muted); }
  .chip.ok { color: var(--green); border-color: rgba(72,225,96,.45); } .chip.bad { color: var(--coral); border-color: rgba(225,90,72,.6); }
  .kv { padding: 0 16px 12px; }
  .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .kv span { color: var(--muted); } .kv b { font: 500 12.5px var(--mono); }
  .gauge { margin: 4px 16px 14px; }
  .gauge .track { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--coral) 0 16.6%, rgba(225,90,72,.35) 16.6% 33.3%, var(--raised) 33.3%); }
  .gauge .track i { position: absolute; top: -4px; width: 3px; height: 14px; margin-left: -1px; background: var(--text); border-radius: 1px; }
  .gauge .ends { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--muted); margin-top: 6px; }
  .list { max-height: 330px; overflow-y: auto; }
  .ev { display: grid; grid-template-columns: 74px 64px 1fr; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .ev .when { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .ev .why { color: var(--muted); grid-column: 2 / -1; font-size: 12px; }
  .alert { padding: 10px 16px; border-left: 2px solid var(--coral); background: rgba(225,90,72,.08); border-bottom: 1px solid var(--line); }
  .notes { padding: 4px 16px 14px; color: var(--muted); font-size: 12.5px; }
  .notes div { padding: 3px 0; }
  .empty { padding: 60px 16px; color: var(--muted); text-align: center; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header>
  <span class="logo"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 1.5 20.5 11 11 20.5 1.5 11Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 6.5 15.5 11 11 15.5 6.5 11Z" fill="currentColor"/></svg></span>
  <b>Hedge desk</b>
  <div class="tabs" id="tabs"></div>
  <div class="right" id="clock"></div>
</header>
<div id="root"><div class="empty">Loading…</div></div>
<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (x, dp = 2) => x === null || x === undefined ? "—" : (x < 0 ? "−" : "") + "$" + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });
const pct = (bps) => bps === null || bps === undefined ? "—" : (bps / 100).toFixed(1) + "%";
const time = (ms) => new Date(ms).toLocaleTimeString([], { hour12: false });
const tone = (x) => x > 0 ? "up" : x < 0 ? "down" : "";
let picked = localStorage.getItem("hedge:picked");

function render(d) {
  const tabs = document.getElementById("tabs");
  if (!d.hedgers.length) { document.getElementById("root").innerHTML = `<div class="empty">No hedger has a journal under ${esc(d.root)} yet. Start one with <span class="mono">npm run shadow</span>.</div>`; tabs.innerHTML = ""; return; }
  if (!d.hedgers.some(h => h.name === picked)) picked = d.hedgers[0].name;
  tabs.innerHTML = d.hedgers.map(h => `<button class="${h.name === picked ? "on" : ""}" data-n="${esc(h.name)}"><i class="dot ${!h.report ? "" : h.report.trouble || h.report.ageSecs > 60 ? "bad" : "ok"}"></i>${esc(h.name)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => { picked = b.dataset.n; localStorage.setItem("hedge:picked", picked); render(d); });
  const h = d.hedgers.find(x => x.name === picked), r = h.report;
  const on = Object.values(h.switches ?? {}).some(v => v === "on");
  let html = "<main>";
  if (!r) {
    html += `<section class="full"><div class="banner"><span class="state">NO REPORT</span><span class="why">This hedger has a journal but has not reported a pass yet. It is not running, or it ran before reports existed.</span></div></section>`;
  } else {
    const stale = r.ageSecs > 60;
    html += `<section class="full">
      <div class="banner"><span class="state ${r.trouble ? "bad" : "ok"}">${esc(r.state)}</span><span class="why">${esc(r.reason)}</span>
        <span class="age ${stale ? "stale" : ""}">${stale ? "NOT RUNNING? " : ""}last pass ${r.ageSecs}s ago · venue ${esc(h.venue)} · hedging ${on ? "switched on" : "switched off"}</span></div>
      <div class="tiles">
        <div class="tile"><div class="l">Vaults hold</div><div class="v">${money(r.totals.vault, 0)}</div><div class="s">all markets, both sides</div></div>
        <div class="tile"><div class="l">Hedged on the venue</div><div class="v">${money(r.totals.hedge, 0)}</div><div class="s">${r.totals.retainedShare === null ? "nothing to hedge" : pct(10000 - r.totals.retainedShare) + " of it"}</div></div>
        <div class="tile"><div class="l">Vaults still carry</div><div class="v ${r.totals.retained > 0 && r.totals.retainedShare > 5000 ? "down" : ""}">${money(r.totals.retained, 0)}</div><div class="s">${pct(r.totals.retainedShare)} of what they hold</div></div>
        <div class="tile"><div class="l">A ${pct(r.totals.stressBps)} move would cost</div><div class="v">${money(r.totals.stress, 0)}</div><div class="s">${r.totals.stressOfNav === null ? "on what is left open" : pct(r.totals.stressOfNav) + " of the vaults' value"}</div></div>
        <div class="tile"><div class="l">Hedge result</div><div class="v ${tone(r.totals.pnl)}">${money(r.totals.pnl)}</div><div class="s">fees ${money(-r.totals.fees)} · funding ${money(-r.totals.funding)}</div></div>
        <div class="tile"><div class="l">Hedge account</div><div class="v">${r.account ? money(r.account.equity, 0) : "—"}</div><div class="s">${r.account ? "room for " + money(r.account.room, 0) + " more" : esc(r.venueError ?? "not readable")}</div></div>
      </div></section>`;
    html += `<section><h3>Markets</h3><table><thead><tr><th>Market</th><th class="t">State</th><th>Vault holds</th><th>Meant to keep</th><th>Hedge needed</th><th>Hedge held</th><th>Hedged</th><th>Still open</th><th>Limit</th><th>Hedge result</th><th>Liquidated at</th></tr></thead><tbody>`
      + r.rows.map(x => { const s = r.symbols.find(y => y.symbol === x.symbol) ?? {}; return `<tr title="${esc(s.reason)}"><td><b>${esc(x.symbol)}</b></td><td class="t"><span class="chip ${s.trouble ? "bad" : s.state === "HEDGED" ? "ok" : ""}">${esc(x.state)}</span></td><td class="n">${esc(x["vault holds"])}</td><td class="n">${esc(x["meant to keep"])}</td><td class="n">${esc(x["hedge needed"])}</td><td class="n">${esc(x["hedge held"])}</td><td class="n">${esc(x.hedged)}</td><td class="n">${esc(x["still open"])}</td><td class="n muted">${esc(x.limit)}</td><td class="n ${/^-/.test(x["hedge result"]) ? "down" : x["hedge result"] === "$0.00" ? "" : "up"}">${esc(x["hedge result"])}</td><td class="n">${esc(x["liquidated at"])}</td></tr>`; }).join("")
      + `</tbody></table>`
      + (r.symbols.some(s => s.trouble) ? r.symbols.filter(s => s.trouble).map(s => `<div class="alert"><b>${esc(s.state)} · ${esc(s.symbol)}</b> — ${esc(s.reason)}</div>`).join("") : "")
      + `<div class="notes">${r.lines.filter(l => !/^(STALE|DEGRADED|FAILED|UNKNOWN|EMERGENCY) /.test(l)).map(l => `<div>${esc(l)}</div>`).join("")}</div></section>`;
    const a = r.account;
    html += `<section><h3>Hedge account</h3>` + (a ? `
      <div class="kv">
        <div><span>Worth</span><b>${money(a.equity)}</b></div>
        <div><span>Margin in use</span><b>${money(a.marginUsed)}</b></div>
        <div><span>Free margin</span><b>${money(a.free)}</b></div>
        <div><span>Room for more hedge</span><b>${money(a.room, 0)}</b></div>
        <div><span>Leverage</span><b>${a.leverage === null ? "—" : a.leverage.toFixed(2) + "×"}</b></div>
        <div><span>Not explained by the ledger</span><b class="${Math.abs(a.unexplained ?? 0) >= 0.01 ? "down" : ""}">${a.unexplained === null ? "—" : money(Math.abs(a.unexplained) < 0.005 ? 0 : a.unexplained)}</b></div>
        <div><span>Distance to liquidation</span><b class="${a.mode !== "ok" ? "down" : ""}">${a.liqDistance === null ? "no hedge open" : a.liqDistance > 10000 ? "more than 100%" : pct(a.liqDistance)}${a.mode === "deleverage" ? " · cutting hedges" : a.mode === "no_increase" ? " · shrink only" : ""}</b></div>
      </div>
      <div class="gauge"><div class="track">${a.liqDistance === null ? "" : `<i style="left:${Math.min(100, Math.max(0, a.liqDistance / 30))}%"></i>`}</div><div class="ends"><span>0%</span><span>5% cut</span><span>10% shrink only</span><span>30%+</span></div></div>` : `<div class="notes">${esc(r.venueError ?? "The venue account could not be read on the last pass.")}</div>`)
      + `</section>`;
  }
  if (h.halts?.length || h.unresolved?.length || h.error) {
    html += `<section class="full">` + (h.error ? `<div class="alert">${esc(h.error)}</div>` : "")
      + (h.halts ?? []).map(x => `<div class="alert"><b>HALTED ${esc(x.scope)}</b> — ${esc(x.reason)}. Look at the venue, then adopt its position and resume from the command line.</div>`).join("")
      + (h.unresolved ?? []).map(x => `<div class="alert"><b>Order outcome not known</b> — ${esc(x.symbol)} ${esc(x.side)} ${esc(x.size)} (${esc(x.status)})</div>`).join("") + `</section>`;
  }
  html += `<section><h3>Latest orders</h3>` + (h.lastOrders?.length ? `<table><thead><tr><th>Time</th><th class="t">Market</th><th class="t">Side</th><th>Size</th><th>Filled</th><th class="t">Outcome</th></tr></thead><tbody>`
      + h.lastOrders.map(o => `<tr><td class="n muted">${time(o.at)}</td><td class="t"><b>${esc(o.symbol)}</b></td><td class="t ${o.side === "buy" ? "up" : "down"}">${esc(o.side)}${o.reduceOnly ? " · reduce" : ""}</td><td class="n">${esc(o.size)}</td><td class="n">${esc(o.filled)}</td><td class="t"><span class="chip ${o.status === "filled" ? "ok" : o.status === "pending" || o.status === "cancelled" && o.filled !== "0" ? "" : "bad"}">${esc(o.status)}</span></td></tr>`).join("") + `</tbody></table>` : `<div class="notes">No orders yet.</div>`) + `</section>`;
  html += `<section><h3>State changes</h3><div class="list">` + (h.transitions?.length ? h.transitions.map(t => `<div class="ev"><span class="when">${time(t.atMs)}</span><b>${esc(t.scope === "*" ? "hedge" : t.scope)}</b><span><span class="muted">${esc(t.from ?? "start")} →</span> <span class="${t.trouble ? "down" : ""}">${esc(t.to)}</span></span><span class="why">${esc(t.reason)}</span></div>`).join("") : `<div class="notes">None recorded yet.</div>`) + `</div></section>`;
  html += "</main>";
  const root = document.getElementById("root");
  root.replaceChildren($(html));
  document.getElementById("clock").textContent = "read-only · refreshed " + time(d.at);
}
async function tick() {
  try { render(await (await fetch("/data")).json()); }
  catch (e) { document.getElementById("clock").textContent = "dashboard server not reachable"; }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
